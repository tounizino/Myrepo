<style>
.wp-responsive-table-wrapper {
  width: 100%;
  overflow-x: auto;
  margin: 20px 0;
  -webkit-overflow-scrolling: touch;
}

.wp-responsive-table {
  width: 100%;
  border-collapse: collapse;
  background-color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen-Sans, Ubuntu, Cantarell, 'Helvetica Neue', sans-serif;
  font-size: 14px;
  line-height: 1.6;
  color: #333333;
}

.wp-responsive-table thead {
  background-color: #f8f9fa;
}

.wp-responsive-table th {
  padding: 14px 12px;
  text-align: left;
  font-weight: 600;
  color: #2c3e50;
  border: 1px solid #e0e0e0;
  text-transform: uppercase;
  font-size: 12px;
  letter-spacing: 0.5px;
}

.wp-responsive-table td {
  padding: 12px;
  border: 1px solid #e0e0e0;
  color: #555555;
}

.wp-responsive-table tbody tr {
  transition: background-color 0.2s ease;
}

.wp-responsive-table tbody tr:nth-child(even) {
  background-color: #f9f9f9;
}

.wp-responsive-table tbody tr:hover {
  background-color: #f0f4f8;
}

@media screen and (max-width: 768px) {
  .wp-responsive-table {
    border: 0;
    font-size: 13px;
  }

  .wp-responsive-table thead {
    display: none;
  }

  .wp-responsive-table tr {
    margin-bottom: 15px;
    display: block;
    border: 1px solid #e0e0e0;
    background-color: #ffffff;
  }

  .wp-responsive-table td {
    display: block;
    text-align: right;
    border: none;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 12px;
  }

  .wp-responsive-table td:last-child {
    border-bottom: 0;
  }

  .wp-responsive-table td:before {
    content: attr(data-label);
    float: left;
    font-weight: 600;
    color: #2c3e50;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
  }

  .wp-responsive-table tbody tr:nth-child(even) {
    background-color: #ffffff;
  }

  .wp-responsive-table tbody tr:hover {
    background-color: #f9f9f9;
  }
}

@media screen and (max-width: 480px) {
  .wp-responsive-table {
    font-size: 12px;
  }
  
  .wp-responsive-table td {
    padding: 8px 10px;
  }
}
</style>
