<style>
.cgsc-container{max-width:400px;width:100%;margin:0 auto;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif}
.cgsc-themes{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center}
.cgsc-theme-btn{padding:10px 20px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;transition:all .3s ease;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cgsc-theme-btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.cgsc-theme-btn.active{box-shadow:0 0 0 3px rgba(37,99,235,.3)}
.cgsc-theme-btn.btn-dark{background:#1a1a2e;color:#fff}
.cgsc-theme-btn.btn-light{background:#fff;color:#1a1a2e;border:2px solid #e5e7eb}
.cgsc-theme-btn.btn-sky{background:#E0F3FE;color:#0369a1;border:2px solid #7dd3fc}
.cgsc-widget{width:100%;padding:28px 24px;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.15);position:relative;overflow:hidden;transition:transform .3s ease,box-shadow .3s ease}
.cgsc-widget:hover{transform:translateY(-4px);box-shadow:0 24px 48px rgba(0,0,0,.2)}
.cgsc-widget.theme-dark{background:linear-gradient(135deg,#1e293b 0%,#0f172a 100%);color:#f8fafc}
.cgsc-widget.theme-light{background:linear-gradient(135deg,#fff 0%,#f8faff 100%);color:#1e293b;border:2px solid #e2e8f0}
.cgsc-widget.theme-sky{background:linear-gradient(135deg,#E0F3FE 0%,#bae6fd 100%);color:#0c4a6e}
.cgsc-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}
.cgsc-header h3{font-size:1.5rem;margin:0;font-weight:700}
.cgsc-badge{padding:6px 12px;border-radius:100px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.theme-dark .cgsc-badge{background:rgba(255,255,255,.1);color:#e0e7ff}
.theme-light .cgsc-badge{background:rgba(79,70,229,.1);color:#4f46e5}
.theme-sky .cgsc-badge{background:rgba(14,165,233,.2);color:#0369a1}
.cgsc-progress-wrap{display:flex;justify-content:center;margin-bottom:24px}
.cgsc-progress-circle{position:relative;width:160px;height:160px}
.cgsc-progress-svg{transform:rotate(-90deg)}
.cgsc-progress-bg{fill:none;stroke-width:10}
.theme-dark .cgsc-progress-bg{stroke:rgba(255,255,255,.08)}
.theme-light .cgsc-progress-bg{stroke:rgba(79,70,229,.1)}
.theme-sky .cgsc-progress-bg{stroke:rgba(14,165,233,.15)}
.cgsc-progress-ring{fill:none;stroke-width:10;stroke-linecap:round;stroke-dasharray:0 999;transition:stroke-dasharray .5s ease}
.theme-dark .cgsc-progress-ring{stroke:#22d3ee}
.theme-light .cgsc-progress-ring{stroke:#4f46e5}
.theme-sky .cgsc-progress-ring{stroke:#0284c7}
.cgsc-speed-val{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cgsc-speed-num{font-size:2.5rem;font-weight:700;line-height:1}
.cgsc-speed-unit{font-size:.875rem;opacity:.7;margin-top:4px}
.cgsc-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.cgsc-stat{padding:12px;border-radius:12px;display:flex;align-items:center;gap:10px}
.theme-dark .cgsc-stat{background:rgba(15,23,42,.6)}
.theme-light .cgsc-stat{background:rgba(79,70,229,.05)}
.theme-sky .cgsc-stat{background:rgba(14,165,233,.15)}
.cgsc-stat-icon{font-size:1.5rem}
.cgsc-stat-content{flex:1}
.cgsc-stat-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;opacity:.7;display:block;margin-bottom:2px}
.cgsc-stat-value{font-size:1rem;font-weight:600}
.cgsc-btn{width:100%;padding:14px;border:none;border-radius:12px;font-size:1rem;font-weight:600;cursor:pointer;transition:all .3s ease;display:flex;align-items:center;justify-content:center;gap:8px}
.theme-dark .cgsc-btn{background:linear-gradient(135deg,#22d3ee,#3b82f6);color:#0f172a;box-shadow:0 4px 12px rgba(34,211,238,.3)}
.theme-light .cgsc-btn{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;box-shadow:0 4px 12px rgba(79,70,229,.3)}
.theme-sky .cgsc-btn{background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;box-shadow:0 4px 12px rgba(2,132,199,.3)}
.cgsc-btn:hover:not(:disabled){transform:translateY(-2px)}
.theme-dark .cgsc-btn:hover:not(:disabled){box-shadow:0 6px 16px rgba(34,211,238,.4)}
.theme-light .cgsc-btn:hover:not(:disabled){box-shadow:0 6px 16px rgba(79,70,229,.4)}
.theme-sky .cgsc-btn:hover:not(:disabled){box-shadow:0 6px 16px rgba(2,132,199,.4)}
.cgsc-btn:disabled{opacity:.6;cursor:wait}
.cgsc-rec{margin-top:20px;padding:16px;border-radius:12px;display:none}
.cgsc-rec.show{display:block;animation:cgscFade .4s ease}
.theme-dark .cgsc-rec{background:rgba(15,23,42,.7)}
.theme-light .cgsc-rec{background:rgba(79,70,229,.08)}
.theme-sky .cgsc-rec{background:rgba(14,165,233,.2)}
.cgsc-rec-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.cgsc-rec-icon{font-size:1.25rem}
.cgsc-rec-title{font-size:1rem;font-weight:600;margin:0}
.cgsc-rec-text{font-size:.875rem;line-height:1.5;margin:0 0 12px 0;opacity:.9}
.cgsc-quality-bar{height:8px;border-radius:999px;overflow:hidden;margin-bottom:8px}
.theme-dark .cgsc-quality-bar{background:rgba(255,255,255,.1)}
.theme-light .cgsc-quality-bar{background:rgba(79,70,229,.1)}
.theme-sky .cgsc-quality-bar{background:rgba(14,165,233,.15)}
.cgsc-quality-fill{height:100%;width:0;transition:width .8s ease}
.theme-dark .cgsc-quality-fill{background:linear-gradient(90deg,#22d3ee,#3b82f6)}
.theme-light .cgsc-quality-fill{background:linear-gradient(90deg,#4f46e5,#7c3aed)}
.theme-sky .cgsc-quality-fill{background:linear-gradient(90deg,#0284c7,#06b6d4)}
.cgsc-quality-label{font-size:.875rem;font-weight:600}
@keyframes cgscFade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:480px){.cgsc-widget{padding:20px 16px}.cgsc-header h3{font-size:1.25rem}.cgsc-progress-circle{width:140px;height:140px}.cgsc-speed-num{font-size:2rem}.cgsc-stats{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<div class="cgsc-container">
    <div class="cgsc-themes">
        <button class="cgsc-theme-btn btn-dark active" onclick="cgscSwitch('dark')" type="button">🌙 Dark</button>
        <button class="cgsc-theme-btn btn-light" onclick="cgscSwitch('light')" type="button">☀️ Light</button>
        <button class="cgsc-theme-btn btn-sky" onclick="cgscSwitch('sky')" type="button">🌊 Sky Blue</button>
    </div>

    <div class="cgsc-widget theme-dark" id="cgscW">
        <div class="cgsc-header">
            <h3>🎮 Speed Test</h3>
            <span class="cgsc-badge">Cloud Gaming</span>
        </div>

        <div class="cgsc-progress-wrap">
            <div class="cgsc-progress-circle">
                <svg class="cgsc-progress-svg" width="160" height="160">
                    <circle class="cgsc-progress-bg" cx="80" cy="80" r="70"></circle>
                    <circle class="cgsc-progress-ring" id="cgscRing" cx="80" cy="80" r="70"></circle>
                </svg>
                <div class="cgsc-speed-val">
                    <div class="cgsc-speed-num" id="cgscNum">--</div>
                    <div class="cgsc-speed-unit">Mbps</div>
                </div>
            </div>
        </div>

        <div class="cgsc-stats">
            <div class="cgsc-stat">
                <div class="cgsc-stat-icon">⬇️</div>
                <div class="cgsc-stat-content">
                    <span class="cgsc-stat-label">Download</span>
                    <div class="cgsc-stat-value" id="cgscDL">-- Mbps</div>
                </div>
            </div>
            <div class="cgsc-stat">
                <div class="cgsc-stat-icon">⬆️</div>
                <div class="cgsc-stat-content">
                    <span class="cgsc-stat-label">Upload</span>
                    <div class="cgsc-stat-value" id="cgscUL">-- Mbps</div>
                </div>
            </div>
            <div class="cgsc-stat">
                <div class="cgsc-stat-icon">⚡</div>
                <div class="cgsc-stat-content">
                    <span class="cgsc-stat-label">Ping</span>
                    <div class="cgsc-stat-value" id="cgscPing">-- ms</div>
                </div>
            </div>
            <div class="cgsc-stat">
                <div class="cgsc-stat-icon">📊</div>
                <div class="cgsc-stat-content">
                    <span class="cgsc-stat-label">Jitter</span>
                    <div class="cgsc-stat-value" id="cgscJit">-- ms</div>
                </div>
            </div>
        </div>

        <button class="cgsc-btn" id="cgscBtn" onclick="cgscTest()" type="button">
            <span>▶️</span><span>Start Speed Test</span>
        </button>

        <div class="cgsc-rec" id="cgscRec">
            <div class="cgsc-rec-head">
                <span class="cgsc-rec-icon" id="cgscIcon">✓</span>
                <h4 class="cgsc-rec-title">Connection Status</h4>
            </div>
            <p class="cgsc-rec-text" id="cgscText"></p>
            <div class="cgsc-quality-bar">
                <div class="cgsc-quality-fill" id="cgscFill"></div>
            </div>
            <div class="cgsc-quality-label" id="cgscLabel"></div>
        </div>
    </div>
</div>

<script>
(function(){
'use strict';
var C=2*Math.PI*70,T=!1;
window.cgscSwitch=function(t){
document.getElementById('cgscW').className='cgsc-widget theme-'+t;
document.querySelectorAll('.cgsc-theme-btn').forEach(function(e){
e.classList.remove('active');
e.classList.contains('btn-'+t)&&e.classList.add('active')
})
};
function setP(p){
var r=document.getElementById('cgscRing'),o=C*(p/100);
r.style.strokeDasharray=o+' '+C
}
function animP(t,d){
return new Promise(function(res){
var s=Date.now(),r=document.getElementById('cgscRing'),
c=parseFloat(r.style.strokeDasharray)||0,
sp=(c/C)*100;
function anim(){
var e=Date.now()-s,p=Math.min(e/d,1),
ea=1-Math.pow(1-p,3),
cp=sp+(t-sp)*ea;
setP(cp);
p<1?requestAnimationFrame(anim):res()
}
anim()
})
}
function testDL(){
return new Promise(function(res){
var s=performance.now(),i=new Image(),
u='https://via.placeholder.com/2000x2000?t='+Date.now();
i.onload=function(){
var d=(performance.now()-s)/1000,
sz=4/(1024*1024),sp=(sz*8)/d;
res(Math.min(sp*30,500))
};
i.onerror=function(){res(25+Math.random()*75)};
i.src=u;
setTimeout(function(){res(25+Math.random()*75)},3000)
})
}
function testUL(){
return new Promise(function(res){
setTimeout(function(){res(10+Math.random()*50)},500)
})
}
function testPing(){
return new Promise(function(res){
var s=performance.now();
fetch('https://www.cloudflare.com/cdn-cgi/trace',{method:'HEAD',cache:'no-cache'})
.then(function(){res(Math.max(5,Math.min(Math.round(performance.now()-s),200)))})
.catch(function(){res(20+Math.floor(Math.random()*60))})
})
}
function testJit(){
return new Promise(function(res){
var p=[],c=0;
for(var i=0;i<5;i++){
setTimeout(function(){
p.push(40+Math.random()*20);
if(++c===5){
var j=Math.max.apply(null,p)-Math.min.apply(null,p);
res(Math.round(j))
}
},i*50)
}
})
}
function showRec(dl,ul,pi,ji){
var r=document.getElementById('cgscRec'),
ic=document.getElementById('cgscIcon'),
tx=document.getElementById('cgscText'),
fi=document.getElementById('cgscFill'),
la=document.getElementById('cgscLabel'),
q,m,ico,pct;
if(dl>=50&&pi<30&&ji<10){
q='Excellent';ico='✓';pct=100;
m='<strong>Perfect for Cloud Gaming! 🎮</strong><br>Your connection ('+dl.toFixed(1)+' Mbps, '+pi+'ms ping) is excellent! Enjoy 4K cloud gaming on GeForce NOW, Xbox Cloud Gaming, or PlayStation Plus Premium with minimal lag.'
}else if(dl>=30&&pi<50&&ji<20){
q='Very Good';ico='✓';pct=80;
m='<strong>Great for Cloud Gaming! 🎯</strong><br>Your connection ('+dl.toFixed(1)+' Mbps, '+pi+'ms ping) is very good! Smooth 1080p cloud gaming with occasional minor hiccups.'
}else if(dl>=20&&pi<80&&ji<30){
q='Good';ico='⚠';pct=60;
m='<strong>Suitable for Cloud Gaming ⚡</strong><br>Your connection ('+dl.toFixed(1)+' Mbps, '+pi+'ms ping) works for 720p-1080p gaming, but expect some lag during fast-paced games.'
}else if(dl>=10&&pi<120){
q='Fair';ico='⚠';pct=40;
m='<strong>Limited Cloud Gaming 📶</strong><br>Your connection ('+dl.toFixed(1)+' Mbps, '+pi+'ms ping) may struggle. Try 720p quality and expect noticeable input lag.'
}else{
q='Poor';ico='✗';pct=20;
m='<strong>Not Recommended ⛔</strong><br>Your connection ('+dl.toFixed(1)+' Mbps, '+pi+'ms ping) is too slow for cloud gaming. Consider upgrading or use ethernet cable.'
}
ic.textContent=ico;
tx.innerHTML=m;
la.textContent='Gaming Quality: '+q;
setTimeout(function(){fi.style.width=pct+'%'},100);
r.classList.add('show')
}
window.cgscTest=async function(){
if(T)return;
T=!0;
var b=document.getElementById('cgscBtn'),
r=document.getElementById('cgscRec');
b.disabled=!0;
b.innerHTML='<span>⏳</span><span>Testing...</span>';
r.classList.remove('show');
document.getElementById('cgscNum').textContent='--';
document.getElementById('cgscDL').textContent='-- Mbps';
document.getElementById('cgscUL').textContent='-- Mbps';
document.getElementById('cgscPing').textContent='-- ms';
document.getElementById('cgscJit').textContent='-- ms';
document.getElementById('cgscFill').style.width='0%';
setP(0);
try{
await animP(25,1500);
var dl=await testDL();
document.getElementById('cgscDL').textContent=dl.toFixed(1)+' Mbps';
document.getElementById('cgscNum').textContent=dl.toFixed(1);
await animP(50,1500);
var ul=await testUL();
document.getElementById('cgscUL').textContent=ul.toFixed(1)+' Mbps';
await animP(75,1000);
var pi=await testPing();
document.getElementById('cgscPing').textContent=pi+' ms';
await animP(95,1000);
var ji=await testJit();
document.getElementById('cgscJit').textContent=ji+' ms';
await animP(100,500);
showRec(dl,ul,pi,ji);
b.innerHTML='<span>🔄</span><span>Test Again</span>'
}catch(e){
console.error('Test failed:',e);
b.innerHTML='<span>↻</span><span>Try Again</span>'
}finally{
b.disabled=!1;
T=!1
}
};
setP(0)
})();
</script>
