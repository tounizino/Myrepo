<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Video Downloader</title>
    <style>
        /* Social Video Downloader Styles */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            margin: 0;
        }

        .svd-container {
            max-width: 680px;
            margin: 40px auto;
            padding: 24px;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(31, 50, 91, 0.1);
            color: #1f325b;
        }

        .svd-container[data-theme="dark"] {
            background: #0f172a;
            color: #e2e8f0;
            box-shadow: 0 20px 50px rgba(15, 23, 42, 0.6);
        }

        .svd-container[data-theme="dark"] .svd-input {
            background: rgba(15, 23, 42, 0.9);
            color: #e2e8f0;
            border-color: rgba(148, 163, 184, 0.4);
        }

        .svd-container[data-theme="dark"] .svd-input::placeholder {
            color: rgba(148, 163, 184, 0.7);
        }

        .svd-container[data-theme="dark"] .svd-button-primary {
            background: #38bdf8;
            color: #0f172a;
        }

        .svd-container[data-theme="dark"] .svd-result,
        .svd-container[data-theme="dark"] .svd-error {
            background: rgba(15, 23, 42, 0.9);
            border-color: rgba(56, 189, 248, 0.2);
        }

        .svd-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .svd-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            margin-top: 0;
        }

        .svd-subtitle {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 16px;
        }

        .svd-container[data-theme="dark"] .svd-subtitle {
            color: #94a3b8;
        }

        .svd-disclaimer {
            font-size: 13px;
            color: #ef4444;
            font-weight: 600;
            margin: 0;
        }

        .svd-platform-icons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-bottom: 20px;
        }

        .svd-icon {
            font-size: 28px;
            filter: grayscale(0.2);
        }

        .svd-input-section {
            border: 1px solid rgba(148, 163, 184, 0.25);
            padding: 20px;
            border-radius: 14px;
            background: rgba(148, 163, 184, 0.08);
        }

        .svd-input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        @media (min-width: 600px) {
            .svd-input-wrapper {
                flex-direction: row;
            }
        }

        .svd-input {
            flex: 1;
            padding: 14px 16px;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.4);
            font-size: 15px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .svd-input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            outline: none;
        }

        .svd-button {
            border: none;
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }

        .svd-button-primary {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: #ffffff;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
        }

        .svd-button-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 24px rgba(37, 99, 235, 0.25);
        }

        .svd-button-primary:active {
            transform: translateY(0);
        }

        .svd-button-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .svd-result,
        .svd-error {
            margin-top: 24px;
            padding: 20px;
            border-radius: 14px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(148, 163, 184, 0.08);
            display: none;
        }

        .svd-error {
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
            background: rgba(239, 68, 68, 0.08);
        }

        .svd-video-info {
            display: flex;
            gap: 16px;
            align-items: center;
            flex-wrap: wrap;
        }

        .svd-thumbnail {
            width: 120px;
            height: 68px;
            border-radius: 12px;
            background-size: cover;
            background-position: center;
            background-color: #e2e8f0;
        }

        .svd-video-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 4px;
            margin-top: 0;
        }

        .svd-video-platform {
            font-size: 14px;
            color: #64748b;
            margin: 0;
        }

        .svd-container[data-theme="dark"] .svd-video-platform {
            color: #94a3b8;
        }

        .svd-download-options {
            margin-top: 20px;
            display: grid;
            gap: 12px;
        }

        .svd-download-card {
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.1s ease, border-color 0.2s ease;
            flex-wrap: wrap;
            gap: 12px;
        }

        .svd-download-card:hover {
            transform: translateY(-2px);
            border-color: rgba(37, 99, 235, 0.4);
        }

        .svd-download-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .svd-download-name {
            font-weight: 600;
        }

        .svd-download-quality {
            font-size: 13px;
            color: #64748b;
        }

        .svd-container[data-theme="dark"] .svd-download-quality {
            color: #94a3b8;
        }

        .svd-button-secondary {
            padding: 10px 16px;
            border-radius: 10px;
            background: rgba(37, 99, 235, 0.08);
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .svd-button-secondary:hover {
            background: rgba(37, 99, 235, 0.15);
        }

        .svd-container[data-theme="dark"] .svd-button-secondary {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
        }

        .svd-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: #64748b;
        }

        .svd-container[data-theme="dark"] .svd-footer {
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="svd-container" data-theme="light">
        <div class="svd-header">
            <h2 class="svd-title">Social Video Downloader</h2>
            <p class="svd-subtitle">Download videos from Facebook, YouTube, Instagram, and TikTok</p>
            <p class="svd-disclaimer">⚠️ For educational and testing purposes only. Please respect copyright laws.</p>
        </div>
        
        <div class="svd-input-section">
            <div class="svd-platform-icons">
                <span class="svd-icon" title="Facebook Reels">📘</span>
                <span class="svd-icon" title="YouTube">▶️</span>
                <span class="svd-icon" title="Instagram">📷</span>
                <span class="svd-icon" title="TikTok">🎵</span>
            </div>
            
            <div class="svd-input-wrapper">
                <input 
                    type="text" 
                    id="svd-url-input" 
                    class="svd-input" 
                    placeholder="Paste your video URL here..."
                    aria-label="Video URL"
                />
                <button id="svd-download-btn" class="svd-button svd-button-primary">
                    <span class="svd-button-text">Get Download Options</span>
                    <span class="svd-button-loader" style="display: none;">⏳</span>
                </button>
            </div>
        </div>
        
        <div id="svd-result" class="svd-result">
            <div class="svd-video-info">
                <div id="svd-thumbnail" class="svd-thumbnail"></div>
                <div class="svd-info-text">
                    <h3 id="svd-video-title" class="svd-video-title"></h3>
                    <p id="svd-video-platform" class="svd-video-platform"></p>
                </div>
            </div>
            
            <div id="svd-download-options" class="svd-download-options"></div>
        </div>
        
        <div id="svd-error" class="svd-error"></div>
        
        <div class="svd-footer">
            <p class="svd-supported-platforms">
                <strong>Supported Platforms:</strong> 
                YouTube (videos, shorts), TikTok, Instagram (reels, posts, IGTV), Facebook (videos, reels)
            </p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const urlInput = document.getElementById('svd-url-input');
            const downloadBtn = document.getElementById('svd-download-btn');
            const result = document.getElementById('svd-result');
            const error = document.getElementById('svd-error');
            const buttonText = document.querySelector('.svd-button-text');
            const buttonLoader = document.querySelector('.svd-button-loader');
            
            downloadBtn.addEventListener('click', handleDownload);
            
            urlInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    handleDownload();
                }
            });
            
            urlInput.addEventListener('input', function() {
                error.style.display = 'none';
            });
            
            function handleDownload() {
                const url = urlInput.value.trim();
                
                if (!url) {
                    showError('Please enter a valid URL');
                    return;
                }
                
                if (!isValidUrl(url)) {
                    showError('Please enter a valid video URL');
                    return;
                }
                
                setLoading(true);
                error.style.display = 'none';
                result.style.display = 'none';
                
                const platform = detectPlatform(url);
                
                if (!platform) {
                    setLoading(false);
                    showError('Unsupported platform. Please use YouTube, TikTok, Instagram, or Facebook URLs.');
                    return;
                }
                
                setTimeout(() => {
                    const videoData = getVideoData(url, platform);
                    setLoading(false);
                    displayResult(videoData);
                }, 1000);
            }
            
            function isValidUrl(string) {
                try {
                    const url = new URL(string);
                    return url.protocol === 'http:' || url.protocol === 'https:';
                } catch (_) {
                    return false;
                }
            }
            
            function detectPlatform(url) {
                if (/(?:youtube\.com|youtu\.be)/i.test(url)) {
                    return 'youtube';
                } else if (/(?:tiktok\.com)/i.test(url)) {
                    return 'tiktok';
                } else if (/(?:instagram\.com)/i.test(url)) {
                    return 'instagram';
                } else if (/(?:facebook\.com|fb\.watch)/i.test(url)) {
                    return 'facebook';
                }
                return null;
            }
            
            function getVideoData(url, platform) {
                const encodedUrl = encodeURIComponent(url);
                
                const allApis = {
                    youtube: [
                        {
                            name: 'SaveFrom.net',
                            url: 'https://savefrom.net/#url=' + encodedUrl,
                            quality: 'Multiple (144p-4K)'
                        },
                        {
                            name: 'Y2Mate',
                            url: 'https://y2mate.com/',
                            quality: 'HD/SD'
                        },
                        {
                            name: '9xBuddy',
                            url: 'https://9xbuddy.org/process?url=' + encodedUrl,
                            quality: 'Multiple'
                        },
                        {
                            name: 'YT5S',
                            url: 'https://yt5s.com/',
                            quality: 'HD/SD'
                        }
                    ],
                    tiktok: [
                        {
                            name: 'SnapTik',
                            url: 'https://snaptik.app/',
                            quality: 'HD (No Watermark)'
                        },
                        {
                            name: 'SSSTik',
                            url: 'https://ssstik.io/',
                            quality: 'HD'
                        },
                        {
                            name: 'TikMate',
                            url: 'https://tikmate.app/',
                            quality: 'HD/SD'
                        },
                        {
                            name: 'SaveFrom.net',
                            url: 'https://savefrom.net/#url=' + encodedUrl,
                            quality: 'Multiple'
                        }
                    ],
                    instagram: [
                        {
                            name: 'DownloadGram',
                            url: 'https://downloadgram.org/',
                            quality: 'Original'
                        },
                        {
                            name: 'GetInsta',
                            url: 'https://getinsta.app/',
                            quality: 'HD'
                        },
                        {
                            name: 'SnapInsta',
                            url: 'https://snapinsta.app/',
                            quality: 'HD/SD'
                        },
                        {
                            name: 'SaveFrom.net',
                            url: 'https://savefrom.net/#url=' + encodedUrl,
                            quality: 'Multiple'
                        }
                    ],
                    facebook: [
                        {
                            name: 'FBDown',
                            url: 'https://fbdown.net/',
                            quality: 'HD/SD'
                        },
                        {
                            name: 'GetFBStuff',
                            url: 'https://getfbstuff.com/',
                            quality: 'HD/SD'
                        },
                        {
                            name: 'SaveFrom.net',
                            url: 'https://savefrom.net/#url=' + encodedUrl,
                            quality: 'Multiple'
                        },
                        {
                            name: 'FDOWN',
                            url: 'https://fdown.net/',
                            quality: 'HD/SD'
                        }
                    ]
                };
                
                const thumbnails = {
                    youtube: 'https://img.icons8.com/color/240/youtube-play.png',
                    tiktok: 'https://img.icons8.com/color/240/tiktok.png',
                    instagram: 'https://img.icons8.com/color/240/instagram-new.png',
                    facebook: 'https://img.icons8.com/color/240/facebook.png'
                };
                
                return {
                    platform: platform,
                    title: 'Video from ' + platform.charAt(0).toUpperCase() + platform.slice(1),
                    thumbnail: thumbnails[platform],
                    download_options: allApis[platform] || []
                };
            }
            
            function setLoading(loading) {
                if (loading) {
                    buttonText.style.display = 'none';
                    buttonLoader.style.display = 'inline';
                    downloadBtn.disabled = true;
                } else {
                    buttonText.style.display = 'inline';
                    buttonLoader.style.display = 'none';
                    downloadBtn.disabled = false;
                }
            }
            
            function showError(message) {
                error.textContent = message;
                error.style.display = 'block';
                result.style.display = 'none';
            }
            
            function displayResult(data) {
                document.getElementById('svd-video-title').textContent = data.title;
                document.getElementById('svd-video-platform').textContent = 'Platform: ' + data.platform.toUpperCase();
                
                if (data.thumbnail) {
                    document.getElementById('svd-thumbnail').style.backgroundImage = 'url(' + data.thumbnail + ')';
                }
                
                const downloadOptions = document.getElementById('svd-download-options');
                downloadOptions.innerHTML = '';
                
                if (data.download_options && data.download_options.length > 0) {
                    data.download_options.forEach(function(option) {
                        const card = document.createElement('div');
                        card.className = 'svd-download-card';
                        
                        const info = document.createElement('div');
                        info.className = 'svd-download-info';
                        info.innerHTML = '<div class="svd-download-name">' + escapeHtml(option.name) + '</div>' +
                                        '<div class="svd-download-quality">Quality: ' + escapeHtml(option.quality) + '</div>';
                        
                        const button = document.createElement('a');
                        button.className = 'svd-button svd-button-secondary';
                        button.href = option.url;
                        button.target = '_blank';
                        button.rel = 'noopener noreferrer';
                        button.textContent = 'Download ↗';
                        
                        card.appendChild(info);
                        card.appendChild(button);
                        downloadOptions.appendChild(card);
                    });
                } else {
                    downloadOptions.innerHTML = '<p>No download options available for this video.</p>';
                }
                
                result.style.display = 'block';
            }
            
            function escapeHtml(text) {
                const map = {
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    '"': '&quot;',
                    "'": '&#039;'
                };
                return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
            }
        });
    </script>
</body>
</html>
