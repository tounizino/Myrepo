<!-- WordPress Simple Table - Light Theme (Minimal Version) -->
<!-- Perfect for smaller tables with fewer columns -->

<div class="wp-simple-table-wrapper">
  <table class="wp-simple-table">
    <thead>
      <tr>
        <th>Column 1</th>
        <th>Column 2</th>
        <th>Column 3</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td data-label="Column 1">Cell 1</td>
        <td data-label="Column 2">Cell 2</td>
        <td data-label="Column 3">Cell 3</td>
      </tr>
      <tr>
        <td data-label="Column 1">Cell 1</td>
        <td data-label="Column 2">Cell 2</td>
        <td data-label="Column 3">Cell 3</td>
      </tr>
      <tr>
        <td data-label="Column 1">Cell 1</td>
        <td data-label="Column 2">Cell 2</td>
        <td data-label="Column 3">Cell 3</td>
      </tr>
    </tbody>
  </table>
</div>

<style>
.wp-simple-table-wrapper {
  width: 100%;
  overflow-x: auto;
  margin: 20px 0;
}

.wp-simple-table {
  width: 100%;
  border-collapse: collapse;
  background-color: #ffffff;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  font-size: 15px;
  color: #333333;
}

.wp-simple-table th {
  padding: 12px 15px;
  text-align: left;
  font-weight: 600;
  color: #2c3e50;
  background-color: #f5f5f5;
  border: 1px solid #dddddd;
}

.wp-simple-table td {
  padding: 10px 15px;
  border: 1px solid #dddddd;
  color: #555555;
}

.wp-simple-table tbody tr:nth-child(odd) {
  background-color: #ffffff;
}

.wp-simple-table tbody tr:nth-child(even) {
  background-color: #fafafa;
}

@media screen and (max-width: 768px) {
  .wp-simple-table thead {
    display: none;
  }

  .wp-simple-table tr {
    display: block;
    margin-bottom: 12px;
    border: 1px solid #dddddd;
  }

  .wp-simple-table td {
    display: block;
    text-align: right;
    border: none;
    border-bottom: 1px solid #eeeeee;
    padding: 8px 12px;
  }

  .wp-simple-table td:last-child {
    border-bottom: 0;
  }

  .wp-simple-table td:before {
    content: attr(data-label);
    float: left;
    font-weight: 600;
    color: #2c3e50;
  }
}
</style>
