<!-- Cloud Loadout Info Sheet - Light Theme -->
<div class="cl-info-sheet cl-light">
  <style>
    .cl-info-sheet {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      max-width: 450px;
      border-radius: 16px;
      padding: 32px;
      line-height: 1.6;
      margin: 20px auto;
      border: 1px solid rgba(0, 0, 0, 0.08);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      position: relative;
      overflow: hidden;
    }
    .cl-light {
      background-color: #ffffff;
      color: #333333;
    }
    .cl-info-sheet h2 {
      margin-top: 0;
      margin-bottom: 24px;
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #111111;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .cl-info-sheet h2::after {
      content: "";
      height: 2px;
      flex-grow: 1;
      margin-left: 20px;
      background: linear-gradient(90deg, rgba(0,0,0,0.05) 0%, transparent 100%);
    }
    .cl-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px 16px;
    }
    .cl-item {
      display: flex;
      flex-direction: column;
    }
    .cl-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #999;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .cl-value {
      font-size: 0.95rem;
      font-weight: 500;
      color: #222222;
    }
    .cl-full-width {
      grid-column: span 2;
    }
    .cl-footer {
      margin-top: 32px;
      display: flex;
      gap: 12px;
    }
    .cl-link {
      flex: 1;
      display: inline-block;
      padding: 12px 20px;
      background-color: #111111;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      transition: all 0.2s ease;
      text-align: center;
      border: 1px solid #111111;
    }
    .cl-link:hover {
      background-color: transparent;
      color: #111111;
    }
    .cl-badge {
      position: absolute;
      top: 0;
      right: 0;
      background: #f5f5f5;
      padding: 4px 12px;
      font-size: 0.65rem;
      font-weight: 800;
      border-bottom-left-radius: 12px;
      color: #999;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    @media (max-width: 480px) {
      .cl-info-sheet {
        padding: 24px;
        margin: 10px;
      }
      .cl-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .cl-full-width {
        grid-column: span 1;
      }
    }
  </style>
  <div class="cl-badge">Cloud Loadout</div>
  <h2>Arc Raiders</h2>
  <div class="cl-grid">
    <div class="cl-item">
      <span class="cl-label">Developer</span>
      <span class="cl-value">Embark Studios</span>
    </div>
    <div class="cl-item">
      <span class="cl-label">Publisher</span>
      <span class="cl-value">Nexon</span>
    </div>
    <div class="cl-item">
      <span class="cl-label">Release Date</span>
      <span class="cl-value">2026</span>
    </div>
    <div class="cl-item">
      <span class="cl-label">Genre</span>
      <span class="cl-value">Co-op Shooter</span>
    </div>
    <div class="cl-item cl-full-width">
      <span class="cl-label">Available On</span>
      <span class="cl-value">GeForce NOW, Xbox Cloud, PC, PS5, XSX</span>
    </div>
  </div>
  <div class="cl-footer">
    <a href="https://arcraiders.com/" class="cl-link" target="_blank">Visit Website</a>
  </div>
</div>
